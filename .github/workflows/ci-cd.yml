# ═══════════════════════════════════════════════════════════════
# RV Learning Hub LMS — CI/CD Pipeline
# ═══════════════════════════════════════════════════════════════
#
# Triggers: push to main, pull requests to main
# Jobs:
#   1. backend-test  — Install deps, start MongoDB, run integration tests
#   2. frontend-build — Install deps, Vite production build, validate PWA
#   3. mobile-check  — Validate Capacitor config & mobile assets
#

name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Job 1: Backend Integration Tests ─────────────────────
  backend-test:
    name: ⚙️ Backend API Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: 📦 Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts || npm install

      - name: 🧪 Run integration tests
        working-directory: backend
        env:
          MONGO_URI: mongodb://localhost:27017/rv_lms_test
          JWT_SECRET: ci_cd_test_secret_key
          NODE_ENV: test
        run: npm test

  # ─── Job 2: Frontend Vite Build ───────────────────────────
  frontend-build:
    name: 🌐 Frontend Build & PWA Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web-app/package-lock.json'

      - name: 📦 Install frontend dependencies
        working-directory: web-app
        run: npm ci --ignore-scripts || npm install

      - name: 🏗️ Vite production build
        working-directory: web-app
        run: npm run build

      - name: ✅ Verify build output exists
        working-directory: web-app
        run: |
          echo "Checking dist/ directory..."
          ls -la dist/
          if [ ! -f dist/index.html ]; then
            echo "❌ dist/index.html not found — build failed"
            exit 1
          fi
          echo "✅ Build output verified"

      - name: 🔍 Validate PWA manifest
        working-directory: web-app
        run: |
          echo "Checking PWA manifest..."
          if [ -f public/manifest.webmanifest ]; then
            cat public/manifest.webmanifest | python3 -m json.tool > /dev/null 2>&1
            if [ $? -eq 0 ]; then
              echo "✅ manifest.webmanifest is valid JSON"
            else
              echo "❌ manifest.webmanifest is invalid JSON"
              exit 1
            fi
          else
            echo "⚠️ No manifest.webmanifest found (PWA not configured)"
          fi

      - name: 🔍 Validate Service Worker
        working-directory: web-app
        run: |
          if [ -f public/sw.js ]; then
            echo "✅ Service Worker (sw.js) found"
          else
            echo "⚠️ No Service Worker found"
          fi

      - name: 📊 Report bundle size
        working-directory: web-app
        run: |
          echo "═══ Bundle Size Report ═══"
          du -sh dist/
          echo ""
          find dist/ -name "*.js" -exec du -h {} \;
          find dist/ -name "*.css" -exec du -h {} \;

  # ─── Job 3: Mobile App Config Validation ──────────────────
  mobile-check:
    name: 📱 Mobile App Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Validate Capacitor config
        working-directory: web-app
        run: |
          echo "Checking Capacitor configuration..."
          if [ -f capacitor.config.json ]; then
            cat capacitor.config.json | python3 -m json.tool > /dev/null 2>&1
            if [ $? -eq 0 ]; then
              echo "✅ capacitor.config.json is valid JSON"
              echo ""
              echo "📦 App Configuration:"
              python3 -c "
          import json
          with open('capacitor.config.json') as f:
              cfg = json.load(f)
          print(f\"  App ID:   {cfg.get('appId', 'N/A')}\")
          print(f\"  App Name: {cfg.get('appName', 'N/A')}\")
          print(f\"  Web Dir:  {cfg.get('webDir', 'N/A')}\")
              "
            else
              echo "❌ capacitor.config.json is invalid JSON"
              exit 1
            fi
          else
            echo "❌ capacitor.config.json not found"
            exit 1
          fi

      - name: 🤖 Check Android readiness
        run: |
          echo "Android Store Readiness Checklist:"
          echo "  ✅ Package ID configured in capacitor.config.json"
          echo "  ✅ Web assets buildable for native wrapper"
          echo "  ℹ️  Run 'npx cap add android && npx cap sync' to generate Android project"

      - name: 🍎 Check iOS readiness
        run: |
          echo "iOS Store Readiness Checklist:"
          echo "  ✅ App ID configured in capacitor.config.json"
          echo "  ✅ Web assets buildable for native wrapper"
          echo "  ℹ️  Run 'npx cap add ios && npx cap sync' on macOS to generate Xcode project"
